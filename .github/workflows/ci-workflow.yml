name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the checkout; the default token must not be able to write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tag comments for readability): a moved tag
      # cannot swap in different code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # Local HTTP/browser fixtures only — no SAP session or SAP requests.
      - run: npm test
